name: ToxiUI test CI

on:
  pull_request:
  push:
    branches:
      - stable
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    if: (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]'))
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Check if syntax style is valid
        uses: JohnnyMorganz/stylua-action@b01f0cf174adf7b3891599fa03ef1a0f48aac8a7
        if: success()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
      - name: Check if code output is valid (lunarmodules)
        uses: lunarmodules/luacheck@v1
      - name: Check if code output is valid (BigWigsMods)
        uses: BigWigsMods/actions/luacheck@02ca6f20cba2493dbf714924fcc9ccbb7235bd00
        with:
          args: -q
      - name: 打包文件
        uses: montudor/action-zip@v1
        with:
          args: -r .release/ToxiUI_汉化版.zip .
      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: package
          path: .release/*.zip
          retention-days: 7
          compression-level: 6  # Adjust as needed (default is 6)
          if-no-files-found: error  # Change to `ignore` if you want to continue even if files are missing
          overwrite: true  # Ensures the artifact is replaced instead of appending
          include-hidden-files: true